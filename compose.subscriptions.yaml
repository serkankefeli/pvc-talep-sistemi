# Optional production reminder worker. Activate only after SaaS/SMTP provisioning.
services:
  subscription-worker:
    extends:
      file: compose.yaml
      service: api
    profiles: [subscriptions]
    ports: !reset []
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: [python, -m, app.subscription_reminders, --loop, --interval, "3600"]
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
