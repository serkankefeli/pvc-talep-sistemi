map $uri $pvc_cache_control {
    default                                      "";
    "/index.html"                               "no-store, no-cache, must-revalidate, max-age=0";
    "/config.json"                              "no-store, no-cache, must-revalidate, max-age=0";
    "/health"                                   "no-store, max-age=0";
    ~*\.(?:css|js|mjs|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|webp|avif)$ "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    add_header Cache-Control $pvc_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' https: data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /config.json {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|webp|avif)$ {
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
