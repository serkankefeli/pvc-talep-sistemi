<section class="measurement-card" aria-labelledby="measurement-guide-title">
  <div class="guide-heading">
    <div>
      <p class="eyebrow">ÖLÇÜM YARDIMI</p>
      <h3 id="measurement-guide-title">Nereden nereye ölçmeliyim?</h3>
    </div>
    <span>Yaklaşık ölçü yeterli</span>
  </div>

  <div class="guide-content">
    <svg
      viewBox="0 0 400 250"
      role="img"
      [attr.aria-label]="ariaLabel()"
      preserveAspectRatio="xMidYMid meet"
    >
      <title>{{ ariaLabel() }}</title>
      <defs>
        <marker
          id="measure-arrow"
          viewBox="0 0 10 10"
          refX="5"
          refY="5"
          markerWidth="5"
          markerHeight="5"
          orient="auto-start-reverse"
        >
          <path d="M 0 0 L 10 5 L 0 10 z" />
        </marker>
      </defs>

      <rect class="wall" x="82" y="30" width="236" height="170" rx="3" />
      <rect class="opening" x="116" y="50" width="168" height="130" rx="2" />

      @if (guide().variant === 'facade') {
        <line class="panel-line" x1="172" y1="50" x2="172" y2="180" />
        <line class="panel-line" x1="228" y1="50" x2="228" y2="180" />
        <line class="panel-line" x1="116" y1="115" x2="284" y2="115" />
      }

      @if (guide().variant === 'balcony') {
        <rect class="parapet" x="116" y="145" width="168" height="35" />
        <line class="panel-line" x1="172" y1="50" x2="172" y2="145" />
        <line class="panel-line" x1="228" y1="50" x2="228" y2="145" />
      }

      <line class="measure-arrow width-arrow" x1="116" y1="215" x2="284" y2="215" />
      <line class="witness" x1="116" y1="184" x2="116" y2="224" />
      <line class="witness" x1="284" y1="184" x2="284" y2="224" />
      <text x="200" y="241" text-anchor="middle">
        {{ guide().short_width_label }}
      </text>

      <line class="measure-arrow height-arrow" x1="58" y1="50" x2="58" y2="180" />
      <line class="witness" x1="52" y1="50" x2="109" y2="50" />
      <line class="witness" x1="52" y1="180" x2="109" y2="180" />
      <text x="30" y="115" text-anchor="middle" transform="rotate(-90 30 115)">
        {{ guide().short_height_label }}
      </text>
    </svg>

    <ol>
      <li>
        <strong>Genişlik</strong>
        <span>{{ guide().width_instruction }}</span>
      </li>
      <li>
        <strong>Yükseklik</strong>
        <span>{{ guide().height_instruction }}</span>
      </li>
    </ol>
  </div>

  <div class="safety-note" role="note">
    <strong>Bu yaklaşık ön talep ölçüsüdür, imalat ölçüsü değildir.</strong>
    <span> Güvenliğiniz için dışarı sarkmayın. Ulaşamadığınız yerde tahmini ölçü girin. </span>
  </div>
</section>
