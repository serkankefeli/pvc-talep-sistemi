# Ilk TLS sertifikasi alinana kadar merkezi digital-nginx'te kullanilir.
# Sertifika alindiktan sonra dograma.estyazilim.com.conf ile degistirilir.

server {
    listen 80;
    server_name dograma.estyazilim.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
