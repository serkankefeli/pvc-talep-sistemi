# Uygulamaya proxy govdesi. Iki server blogu da bunu include eder, boylece
# 80 ve 443 arasinda ayrisma olmaz.
#
# /etc/nginx/snippets/pvc-proxy-pass.conf olarak kurulur.

location / {
    proxy_pass http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Hiz sinirlayicinin gercek ziyaretciyi gorebilmesi buna baglidir.
    # $remote_addr, Cloudflare araliklari icin real_ip modulu tarafindan
    # zaten gercek ziyaretciye cozulmustur.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Ziyaretcinin gercek semasi; Cloudflare "Flexible" modunda origin'e
    # HTTP ile baglansa bile uygulama dogru semayi gorur.
    proxy_set_header X-Forwarded-Proto $pvc_visitor_scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
}
