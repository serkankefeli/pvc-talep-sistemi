# Host nginx vhost: pvc.montajtakip.com
#
# /etc/nginx/sites-available/pvc.montajtakip.com olarak kopyalanir ve
# sites-enabled'a linklenir. Tek bir alan adi yeterlidir: web container'inin
# nginx'i /api/ isteklerini zaten api container'ina tasir, bu yuzden ayri bir
# api subdomain'i gerekmez.

server {
    listen 80;
    listen [::]:80;
    server_name pvc.montajtakip.com;

    # Certbot webroot dogrulamasi 80 uzerinden yapilir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pvc.montajtakip.com;

    ssl_certificate     /etc/letsencrypt/live/pvc.montajtakip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pvc.montajtakip.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Marka logosu yuklemesi icin. API tarafi ayrica 2 MB sinir uygular.
    client_max_body_size 10m;

    # Diger guvenlik basliklari web container'inin nginx'inden gelir; HSTS
    # yalniz TLS'i sonlandiran katmanda anlamlidir.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/pvc.montajtakip.com.access.log;
    error_log  /var/log/nginx/pvc.montajtakip.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Hiz sinirlayicinin gercek ziyaretciyi gorebilmesi buna baglidir.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# Cloudflare notu: bu kayit su an DNS-only (gri bulut) varsayilmistir ve
# $remote_addr gercek ziyaretcidir. Turuncu buluta alinirsa $remote_addr
# Cloudflare uc sunucusu olur; o durumda bu server blogunun basina
# Cloudflare IP araliklari icin `set_real_ip_from` satirlari ve
# `real_ip_header CF-Connecting-IP;` eklenmelidir. Aksi halde hiz
# sinirlayici tum ziyaretcileri Cloudflare IP'si olarak gorur.
