# Host nginx vhost: pvc.montajtakip.com
#
# /etc/nginx/sites-available/pvc.montajtakip.com olarak kopyalanir ve
# sites-enabled'a linklenir. Tek bir alan adi yeterlidir: web container'inin
# nginx'i /api/ isteklerini zaten api container'ina tasir, bu yuzden ayri bir
# api subdomain'i gerekmez.

server {
    listen 80;
    listen [::]:80;
    server_name pvc.montajtakip.com;

    # Certbot webroot dogrulamasi 80 uzerinden yapilir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pvc.montajtakip.com;

    ssl_certificate     /etc/letsencrypt/live/pvc.montajtakip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pvc.montajtakip.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Cloudflare turuncu bulut arkasindayken gercek ziyaretci IP'sini cozer.
    # Joker include: gri bulutta dosya bulunmaz ve bu satir sessizce atlanir.
    # Snippet'i uretmek/guncellemek icin: deploy/nginx/cloudflare-real-ip.sh
    include /etc/nginx/snippets/cloudflare-real-ip*.conf;

    # Marka logosu yuklemesi icin. API tarafi ayrica 2 MB sinir uygular.
    client_max_body_size 10m;

    # Diger guvenlik basliklari web container'inin nginx'inden gelir; HSTS
    # yalniz TLS'i sonlandiran katmanda anlamlidir.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/pvc.montajtakip.com.access.log;
    error_log  /var/log/nginx/pvc.montajtakip.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Hiz sinirlayicinin gercek ziyaretciyi gorebilmesi buna baglidir.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# Cloudflare notu: kayit turuncu bulutta (proxied) yayindadir. Yukaridaki
# joker include, `deploy/nginx/cloudflare-real-ip.sh` ile uretilen snippet'i
# devreye alir ve $remote_addr gercek ziyaretci olur. Gri buluta donulurse
# snippet silinir; include eslesmez, yapilandirma yine gecerlidir.
#
# Cloudflare SSL/TLS modu **Full (strict)** olmalidir. "Flexible" secilirse
# Cloudflare origin'e HTTP ile baglanir, buradaki 80 -> 443 yonlendirmesi
# Cloudflare'e geri doner ve sonsuz yonlendirme dongusu olusur.
