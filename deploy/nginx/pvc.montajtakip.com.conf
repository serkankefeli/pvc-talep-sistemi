# Host nginx vhost: pvc.montajtakip.com
#
# /etc/nginx/sites-available/pvc.montajtakip.com olarak kopyalanir ve
# sites-enabled'a linklenir. Tek bir alan adi yeterlidir: web container'inin
# nginx'i /api/ isteklerini zaten api container'ina tasir, bu yuzden ayri bir
# api subdomain'i gerekmez.
#
# Ayrica kurulmasi gerekenler:
#   /etc/nginx/snippets/pvc-proxy-pass.conf   <- deploy/nginx/pvc-proxy-pass.conf
#   /etc/nginx/snippets/cloudflare-real-ip.conf (opsiyonel, turuncu bulutta)
#        <- deploy/nginx/cloudflare-real-ip.sh ile uretilir

# Ziyaretcinin gercek semasi. Cloudflare "Flexible" modunda origin'e HTTP ile
# baglanir ama X-Forwarded-Proto'yu ziyaretcinin gercek semasiyla gonderir.
# Kosulsuz bir 80 -> 443 yonlendirmesi bu modda Cloudflare'e geri doner ve
# sonsuz dongu olusur; asagidaki degisken bunu engeller.
map $http_x_forwarded_proto $pvc_visitor_scheme {
    default  $scheme;
    "https"  https;
    "http"   http;
}

map $pvc_visitor_scheme $pvc_needs_redirect {
    default  1;
    "https"  0;
}

server {
    listen 80;
    listen [::]:80;
    server_name pvc.montajtakip.com;

    server_tokens off;
    client_max_body_size 10m;

    include /etc/nginx/snippets/cloudflare-real-ip*.conf;

    access_log /var/log/nginx/pvc.montajtakip.com.access.log;
    error_log  /var/log/nginx/pvc.montajtakip.com.error.log;

    # Certbot webroot dogrulamasi 80 uzerinden yapilir ve hicbir kosulda
    # yonlendirilmez.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Ziyaretci gercekten HTTP kullaniyorsa HTTPS'e tasinir. Cloudflare
    # uzerinden gelen ve zaten HTTPS olan istekler asagida karsilanir.
    if ($pvc_needs_redirect) {
        return 301 https://$host$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/pvc-proxy-pass.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pvc.montajtakip.com;

    ssl_certificate     /etc/letsencrypt/live/pvc.montajtakip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pvc.montajtakip.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Marka logosu yuklemesi icin. API tarafi ayrica 2 MB sinir uygular.
    client_max_body_size 10m;

    # Cloudflare turuncu bulut arkasindayken gercek ziyaretci IP'sini cozer.
    # Joker include: gri bulutta dosya bulunmaz ve bu satir sessizce atlanir.
    include /etc/nginx/snippets/cloudflare-real-ip*.conf;

    # Diger guvenlik basliklari web container'inin nginx'inden gelir; HSTS
    # yalniz TLS'i sonlandiran katmanda anlamlidir.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/pvc.montajtakip.com.access.log;
    error_log  /var/log/nginx/pvc.montajtakip.com.error.log;

    include /etc/nginx/snippets/pvc-proxy-pass.conf;
}

# Cloudflare notu
# ---------------
# Kayit turuncu bulutta (proxied) yayindadir.
#
# 1. Gercek ziyaretci IP'si: yukaridaki joker include,
#    `deploy/nginx/cloudflare-real-ip.sh` ile uretilen snippet'i devreye alir.
#    Olmazsa hiz sinirlayici tum ziyaretcileri Cloudflare uc sunucusu sanar.
#
# 2. Sifreleme modu: bu yapilandirma "Flexible" modda da dongu olusturmadan
#    calisir, ANCAK Flexible'da Cloudflare ile sunucu arasindaki trafik
#    sifresizdir; yonetici JWT'si o bacakta duz metin gider. Panel yayina
#    girmeden once mod **Full (strict)** yapilmalidir. Origin'de gecerli bir
#    Let's Encrypt sertifikasi vardir, gecis sorunsuzdur.
