# Ilk TLS sertifikasi alinana kadar kullanilan HTTP vhost.
# Sertifika alindiktan sonra teklif.sunyapi.com.conf ile degistirilir.
server {
    listen 80;
    listen [::]:80;
    server_name teklif.sunyapi.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
