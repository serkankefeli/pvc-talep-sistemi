# Sunucudaki merkezi digital-nginx container'i icin vhost.
# Hostta /root/nginx/conf.d/dograma.estyazilim.com.conf olarak kullanilir.

server {
    listen 80;
    server_name dograma.estyazilim.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dograma.estyazilim.com;

    ssl_certificate /etc/letsencrypt/live/dograma.estyazilim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dograma.estyazilim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DOGRAMA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $dograma_upstream http://dograma-web:80;
        proxy_pass $dograma_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
