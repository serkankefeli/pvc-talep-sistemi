[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-quote-backend"
version = "0.1.0"
description = "Visual PVC configuration and private quote-request API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlmodel>=0.0.24,<0.1",
    "pydantic-settings>=2.8,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

